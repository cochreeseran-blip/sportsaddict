<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slatefinder</title>
<meta name="description" content="Slatefinder — an MLB research tool: 10-day slate browser, confirmed lineups, and daily signals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9.5' y='9.5' width='13' height='13' rx='2' transform='rotate(45 16 16)' fill='none' stroke='%235b9cff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%235b9cff'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="7.2" y="7.2" width="9.6" height="9.6" rx="1.5" transform="rotate(45 12 12)" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name">Slatefinder</span>
      <span class="brand-tag">MLB research</span>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="slate">Slate</button>
    <button class="tab" data-view="signals">Signals</button>
    <button class="tab" data-view="performance">Performance</button>
  </nav>

  <div class="topbar-right">
    <div class="sys-status" id="sysStatus">
      <span class="pulse-dot" id="statusDot"></span>
      <span id="statusText">Connecting</span>
    </div>
    <button class="btn-refresh" id="refreshBtn">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1v3.5H10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Refresh</span>
    </button>
  </div>
</header>

<main id="app">
  <section id="view-slate" class="view active"></section>
  <section id="view-signals" class="view"></section>
  <section id="view-performance" class="view"></section>
</main>

<aside id="gamePanel" class="game-panel" aria-hidden="true">
  <div class="game-panel-inner" id="gamePanelInner"></div>
</aside>
<div id="panelOverlay" class="panel-overlay"></div>

<footer class="footer">
  <span>Research signals only, not betting advice. Verify starters and lineups before first pitch.</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
