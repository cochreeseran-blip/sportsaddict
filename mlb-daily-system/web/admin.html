<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slatefinder Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">Slatefinder<span class="brand-lol"> admin</span></span>
  </div>
  <nav class="tabs" id="adminTabs">
    <button class="tab active" data-view="slate">Slate review</button>
    <button class="tab" data-view="record">Record</button>
    <button class="tab" data-view="users">Users</button>
    <button class="tab" data-view="email">Email</button>
  </nav>
  <div class="topbar-right">
    <span class="sys-status" id="adminWho"></span>
  </div>
</header>

<main id="app">
  <section id="admin-view" class="view active"></section>
</main>

<script src="/admin.js"></script>
</body>
</html>
