<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlateFinder — MLB Slate Research Console</title>
<meta name="description" content="SlateFinder: an interactive MLB research console — 10-day slate browser, confirmed lineups, and daily edge signals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2338e1ff' stroke-width='2'/%3E%3Cpath d='M16 3 A13 13 0 0 1 29 16' fill='none' stroke='%238b5cf6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2338e1ff'/%3E%3C/svg%3E">
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="glow glow-a" aria-hidden="true"></div>
<div class="glow glow-b" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5"/>
      <path class="brand-sweep" d="M20 4 A16 16 0 0 1 36 20" fill="none" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="4.5" class="brand-core"/>
      <line x1="20" y1="20" x2="31" y2="10" class="brand-needle"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name">SLATE<em>FINDER</em></span>
      <span class="brand-tag">MLB RESEARCH CONSOLE</span>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="slate">Slate</button>
    <button class="tab" data-view="signals">Signals</button>
    <button class="tab" data-view="performance">Performance</button>
  </nav>

  <div class="topbar-right">
    <div class="sys-status" id="sysStatus">
      <span class="pulse-dot" id="statusDot"></span>
      <span id="statusText">Connecting</span>
    </div>
    <button class="btn-refresh" id="refreshBtn">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1v3.5H10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Sync Data</span>
    </button>
  </div>
</header>

<main id="app">
  <section id="view-slate" class="view active"></section>
  <section id="view-signals" class="view"></section>
  <section id="view-performance" class="view"></section>
</main>

<aside id="gamePanel" class="game-panel" aria-hidden="true">
  <div class="game-panel-inner" id="gamePanelInner"></div>
</aside>
<div id="panelOverlay" class="panel-overlay"></div>

<footer class="footer">
  <span>SLATEFINDER v2.0</span>
  <span class="footer-sep"></span>
  <span>Research signals only — not betting advice. Verify starters and lineups before first pitch.</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
