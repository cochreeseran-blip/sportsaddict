<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slatefinder Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
<style>
  /* Admin-only additions. Everything else (.btn, .data-table, .pill,
     .modal-backdrop, .field, .board-title, .empty-state) is reused
     straight from styles.css so this doesn't drift from the main app's
     visual language. */
  #app { max-width: 1100px; margin: 0 auto; padding: 22px 20px 64px; }
  .admin-tabs { display: flex; gap: 2px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
  .admin-tab { font: 500 13px var(--font); color: var(--text-2); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; }
  .admin-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .admin-view { display: none; }
  .admin-view.active { display: block; }
  .warn-banner { display: flex; gap: 8px; align-items: flex-start; background: rgba(217,119,6,0.08); border: 1px solid rgba(217,119,6,0.35); border-radius: 8px; padding: 8px 12px; margin-top: 8px; font-size: 12.5px; color: var(--text-2); }
  .pub-locked { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--green); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-card .n { font-size: 26px; font-weight: 650; }
  .stat-card .lbl { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 60px; margin-top: 8px; }
  .spark i { flex: 1; background: var(--accent); border-radius: 1px; min-height: 1px; opacity: 0.75; }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--border-strong); font-size: 11px; font-weight: 650; }
  textarea.compose-body { font: 400 13.5px var(--font); color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px 10px; width: 100%; min-height: 90px; resize: vertical; }
  .pick-check-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .preview-frame { border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; margin-top: 10px; }
  .preview-frame iframe { width: 100%; height: 420px; border: 0; background: #fff; }
  .compliance-fail { color: var(--red); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-name">Slatefinder<span class="brand-lol">.lol</span> <span style="color:var(--text-3);font-weight:500">admin</span></span></div>
</header>

<main id="app">
  <nav class="admin-tabs" id="adminTabs">
    <button class="admin-tab active" data-view="slate">Slate review</button>
    <button class="admin-tab" data-view="users">Users</button>
    <button class="admin-tab" data-view="email">Email</button>
  </nav>

  <section id="view-slate" class="admin-view active"></section>
  <section id="view-users" class="admin-view"></section>
  <section id="view-email" class="admin-view"></section>
</main>

<div id="publishModal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-label="Confirm publish">
    <div class="modal-title">Publish this pick?</div>
    <p style="font-size:13px;color:var(--text-2);line-height:1.55;margin-bottom:16px">
      This is permanent. Once published, this pick is on the public record whether it wins or loses. It cannot be edited or removed.
    </p>
    <div class="modal-error" id="pubError" hidden></div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="pubCancel">Cancel</button>
      <button type="button" class="btn primary" id="pubConfirm">Publish permanently</button>
    </div>
  </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
