<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slateaddict.com</title>
<meta name="description" content="slateaddict.com">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">slateaddict.com</span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="signals">Daily Slate</button>
    <button class="tab" data-view="slate">Research</button>
    <button class="tab" data-view="record">Record</button>
    <button class="tab" data-view="chat">Live Chat</button>
  </nav>

  <div class="topbar-right">
    <div class="account-chip" id="accountChip" hidden>
      <span class="account-avatar" id="accountAvatar"></span>
      <span class="account-name" id="accountName"></span>
      <button class="btn ghost small" id="signOutBtn" title="Sign out">Sign out</button>
    </div>
  </div>
</header>

<main id="app">
  <section id="view-signals" class="view active"></section>
  <section id="view-slate" class="view"></section>
  <section id="view-record" class="view"></section>
  <section id="view-chat" class="view"></section>
</main>

<div id="authGate" class="auth-gate" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <span>slateaddict.com</span>
    </div>

    <div id="authFormWrap">
      <div class="auth-title" id="authTitle">Create your account</div>
      <p class="auth-sub" id="authSub">Your name and face get picked for you. All we need is an email and a password.</p>
      <form id="authForm">
        <label class="field"><span>Email</span>
          <input type="email" id="authEmail" required autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field"><span>Password</span>
          <span class="password-wrap">
            <input type="password" id="authPassword" required minlength="8" autocomplete="new-password" placeholder="8+ characters">
            <button type="button" class="password-toggle" id="authShowPw" aria-label="Show password">Show</button>
          </span>
        </label>
        <label class="remember-row">
          <input type="checkbox" id="authRemember" checked>
          <span>Remember me on this device</span>
        </label>
        <label class="remember-row" id="authMarketingRow">
          <input type="checkbox" id="authMarketing">
          <span>Email me picks and product updates. You can unsubscribe anytime.</span>
        </label>
        <div class="modal-error" id="authError" hidden></div>
        <button type="submit" class="btn primary auth-submit" id="authSubmit">Create account</button>
      </form>
      <div class="auth-toggle-row">
        <span id="authToggleLabel">Already have an account?</span>
        <button type="button" class="auth-toggle" id="authToggle">Log in</button>
      </div>
    </div>

    <div id="authReveal" hidden>
      <p class="auth-sub" style="margin-bottom:14px">Say hello to yourself.</p>
      <div class="auth-reveal-avatar" id="revealAvatar"></div>
      <div class="auth-reveal-name" id="revealName"></div>
      <button type="button" class="btn primary auth-submit" id="authEnter">Enter Slatefinder</button>
    </div>
  </div>
</div>

<footer class="footer">
  <span class="footer-note">Slatefinder. Research signals only, not betting advice.</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
